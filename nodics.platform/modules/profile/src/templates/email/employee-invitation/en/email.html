<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enterprise invitation</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f3f5f4;
      color: #202624;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 24px 12px">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            style="
              width: 100%;
              max-width: 600px;
              table-layout: fixed;
              background-color: #ffffff;
              border-top: 4px solid #11634b;
            "
          >
            <tr>
              <td style="padding: 24px; overflow-wrap: anywhere">
                <p style="color: #11634b; font-size: 14px; font-weight: bold">
                  {{brandName}}
                </p>
                <h1 style="font-size: 24px; line-height: 1.3">
                  You are invited
                </h1>
                <p style="font-size: 16px; line-height: 1.6">
                  You have been invited to {{enterpriseName}} as
                  {{responsibility}}.
                </p>
                <p style="font-size: 16px; line-height: 1.6">{{nextStep}}</p>
                <p style="font-size: 14px; line-height: 1.6; color: #535e58">
                  This invitation does not grant access until you verify your
                  account and accept the invitation. It does not enroll you as a
                  customer.
                </p>
                <p style="font-size: 14px; line-height: 1.6; color: #535e58">
                  Never share your password or verification code.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
