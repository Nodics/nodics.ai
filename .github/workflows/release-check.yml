name: Nodics Release Check

on:
  pull_request:
    branches:
      - development
      - master
  push:
    branches:
      - development
      - master

jobs:
  release-check:
    name: Release check on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install release gate dependencies
        run: npm ci

      - name: Print governed release gate
        run: npm run release:check

      - name: Execute governed release gate
        run: npm run release:check -- --execute

      - name: Execute full release-candidate gate
        if: github.ref == 'refs/heads/development' || github.ref == 'refs/heads/master'
        run: npm run release:check -- --execute --full
