<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review received {{reference}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f3f5f4;
      color: #202624;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 24px 12px">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            style="
              width: 100%;
              max-width: 600px;
              table-layout: fixed;
              background: #ffffff;
              border-top: 4px solid #11634b;
            "
          >
            <tr>
              <td style="padding: 28px 24px; overflow-wrap: anywhere">
                <h1 style="font-size: 24px; line-height: 1.4; margin: 0 0 24px">
                  Review received {{reference}}
                </h1>
                <p style="font-size: 16px; line-height: 1.6; margin: 0">
                  Thanks for sending review {{reference}}. It is now in the
                  governed review flow.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
